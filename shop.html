<style>:root{--bg:#f7f4ee;--c:#fff;--tx:#1d2420;--mu:#6b756e;--br:#2f7d4f;--bd:#e3ddd0}@media(prefers-color-scheme:dark){:root{--bg:#141a16;--c:#1e2621;--tx:#eaf0ec;--mu:#9aa89f;--br:#4fb57a;--bd:#2d3832}}

<script>
const FB={apiKey:"AIzaSyCwZnS7RvwnQXEgwpiZtdfeJe_kj9Af4hw",authDomain:"onlineshop1-4f736.firebaseapp.com",projectId:"onlineshop1-4f736",storageBucket:"onlineshop1-4f736.firebasestorage.app",messagingSenderId:"99781106939",appId:"1:99781106939:web:016dc3430461fcef44645e"}; // paste your NEW Firebase config here (same as in index.html)
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),N=n=>+n||0,mo=n=>'৳'+Math.round(N(n)*100)/100;
let L=localStorage.sl||'bn',t=s=>s.split('|')[L==='bn'?0:1],P=[],cfg={},cart={},V='shop',Q='',CAT='',DONE=null,TR=null;
try{cart=JSON.parse(localStorage.cart||'{}')}catch(e){}
const WN=x=>{x=String(x||'').replace(/\D/g,'');return x.length===11&&x.startsWith('01')?'88'+x:x},
sv=()=>{try{localStorage.cart=JSON.stringify(cart)}catch(e){}},
SN={pending:'অপেক্ষমাণ|Pending',confirmed:'নিশ্চিত|Confirmed',processing:'প্রস্তুত হচ্ছে|Processing',shipped:'পাঠানো হয়েছে|Shipped',delivered:'পৌঁছেছে|Delivered',cancelled:'বাতিল|Cancelled',refunded:'ফেরত|Refunded'};
let C;try{firebase.initializeApp(FB);C=s=>firebase.firestore().collection('shops').doc('main').collection(s)}catch(e){}
const lines=()=>Object.entries(cart).map(([id,q])=>{const p=P.find(x=>x.id===id);return p&&p.stock>0?{p,q:Math.min(q,p.stock)}:null}).filter(Boolean),
sub=()=>lines().reduce((a,l)=>a+l.q*l.p.price,0),ship=()=>{const s=sub();return!s||(N(cfg.free)>0&&s>=N(cfg.free))?0:N(cfg.ship)};
async function load(){if(!C){$('#m').innerHTML='<p>'+t('দোকান এখনো সেটআপ হয়নি|Shop is not set up yet')+'</p>';return}try{cfg=(await C('shopcfg').doc('main').get()).data()||{};P=(await C('pub').get()).docs.map(d=>d.data())}catch(e){$('#m').innerHTML='<p>'+t('লোড হয়নি, পরে চেষ্টা করুন|Could not load, please try later')+'</p>';return}R()}
const add=(id,go)=>{const p=P.find(x=>x.id===id);if(!p||p.stock<=0)return;cart[id]=Math.min(p.stock,(cart[id]||0)+1);sv();if(go){V='cart'}R()},
qty=(id,d)=>{const p=P.find(x=>x.id===id),q=(cart[id]||0)+d;if(q<=0)delete cart[id];else cart[id]=Math.min(q,p.stock);sv();R()};
function R(){$('#hn').textContent='🛍 '+(cfg.name||'Shop');$('#cc').textContent=Object.keys(cart).length;const m=$('#m');

m.innerHTML=({shop:vShop,cart:vCart,co:vCo,done:vDone,track:vTrack})[V]()}
function vShop(){const cats=[...new Set(P.map(p=>p.cat).filter(Boolean))],l=P.filter(p=>(!CAT||p.cat===CAT)&&p.name.toLowerCase().includes(Q.toLowerCase()));
return`${cfg.desc?`<p class="m">${esc(cfg.desc)}</p>`:''}<input placeholder="🔍 ${t('পণ্য খুঁজুন|Search products')}" value="${esc(Q)}" oninput="Q=this.value;R()" onchange="R()"><div><button class="ch ${CAT?'':'ac'}" onclick="CAT='';R()">${t('সব|All')}</button>${cats.map(c=>`<button class="ch ${CAT===c?'ac':''}" onclick="CAT='${esc(c).replace(/'/g,'')}';R()">${esc(c)}</button>`).join('')}</div><div class="g">${l.map(p=>`<div class="cd"><div class="im">${p.img?`<img src="${p.img}" alt="">`:esc(p.icon||'📦')}</div><b>${esc(p.name)}</b><div class="m">${esc(p.desc||'')}</div><div class="r"><b>${mo(p.price)}</b><span class="m">/ ${esc(p.unit)}</span></div><div class="m">${p.stock>0?'✅ '+t('স্টকে আছে|In stock')+' ('+p.stock+')':'❌ '+t('স্টক শেষ|Out of stock')}</div>${p.stock>0?`<div class="r" style="margin-top:6px"><button onclick="add('${p.id}')">🛒 ${t('কার্টে|Add')}</button><button class="p" onclick="add('${p.id}',1)">${t('এখনই কিনুন|Buy now')}</button></div>`:''}</div>`).join('')||`<p class="m">${t('কোনো পণ্য নেই|No products')}</p>`}</div>`}
function vCart(){const ls=lines(),s=sub(),min=N(cfg.min);if(!ls.length)return`<div class="cd">${t('কার্ট খালি|Your cart is empty')}</div><button onclick="V='shop';R()">← ${t('কেনাকাটা|Shop')}</button>`;
return`<div class="cd">${ls.map(l=>`<div class="r" style="margin-bottom:8px"><span>${esc(l.p.icon||'')} ${esc(l.p.name)}<br><span class="m">${mo(l.p.price)} / ${esc(l.p.unit)}</span></span><span><button onclick="qty('${l.p.id}',-1)">−</button> ${l.q} <button onclick="qty('${l.p.id}',1)">+</button></span><b>${mo(l.q*l.p.price)}</b></div>`).join('')}<hr><div class="r"><span>${t('সাবটোটাল|Subtotal')}</span><span>${mo(s)}</span></div><div class="r"><span>${t('ডেলিভারি|Delivery')}</span><span>${ship()?mo(ship()):t('ফ্রি|Free')}</span></div><div class="r"><b>${t('মোট|Total')}</b><b>${mo(s+ship())}</b></div><p class="m">${t('পেমেন্ট: ক্যাশ অন ডেলিভারি|Payment: Cash on delivery')}</p>${min&&s<min?`<p style="color:#c0392b">${t('সর্বনিম্ন অর্ডার|Minimum order')} ${mo(min)}</p>`:''}</div><button onclick="V='shop';R()">← ${t('আরও কিনুন|Continue')}</button> <button class="p" ${min&&s<min?'disabled':''} onclick="V='co';R()">${t('চেকআউট|Checkout')} →</button>`}
function vCo(){const a=cfg.areas||[];return`<div class="cd"><h3>${t('ডেলিভারির তথ্য|Delivery details')}</h3><label>${t('পুরো নাম|Full name')}<input id="f_n"></label><label>${t('মোবাইল নম্বর|Mobile number')}<input id="f_p" type="tel" placeholder="01XXXXXXXXX"></label><label>${t('ঠিকানা|Address')}<textarea id="f_a"></textarea></label><label>${t('জেলা|District')}<input id="f_d"></label><label>${t('এলাকা|Area')}${a.length?`<select id="f_r"><option value="">—</option>${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:'<input id="f_r">'}</label><label>${t('ইমেইল (ঐচ্ছিক)|Email (optional)')}<input id="f_e" type="email"></label><label>${t('ডেলিভারি নির্দেশনা|Delivery instructions')}<textarea id="f_o"></textarea></label><div class="r"><b>${t('মোট|Total')}</b><b>${mo(sub()+ship())}</b></div><p class="m">${t('ক্যাশ অন ডেলিভারি: পণ্য হাতে পেয়ে টাকা দিন।|Cash on delivery: pay when you receive the goods.')}</p></div><button onclick="V='cart';R()">←</button> <button class="p" id="pb" onclick="place()">${t('অর্ডার করুন|Place order')}</button>`}
async function place(){const g=i=>$('#'+i).value.trim(),ls=lines();if(!ls.length)return;const d={name:g('f_n'),phone:g('f_p'),addr:g('f_a'),dist:g('f_d'),area:g('f_r'),email:g('f_e'),note:g('f_o')},s=sub();
if(d.name.length<2||!/^(\+?88)?01[3-9]\d{8}$/.test(d.phone.replace(/[\s-]/g,''))||d.addr.length<5||!d.dist)return alert(t('নাম, সঠিক মোবাইল নম্বর, ঠিকানা ও জেলা দিন|Enter name, a valid mobile number, address and district'));
if(N(cfg.min)>0&&s<N(cfg.min))return alert(t('সর্বনিম্ন অর্ডার পূরণ হয়নি|Minimum order not met'));
const id='SB'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join(''),now=Date.now(),
o={id,items:ls.map(l=>({id:l.p.id,name:l.p.name,unit:l.p.unit,qty:l.q,price:l.p.price})),sub:s,ship:ship(),total:s+ship(),...d,pay:'cod',payStatus:'unpaid',status:'pending',created:now,hist:[{s:'pending',t:now}]};
$('#pb').disabled=true;try{await C('orders').doc(id).set(o);cart={};sv();DONE=o;try{localStorage.last=id}catch(e){}V='done';load()}catch(e){$('#pb').disabled=false;alert(t('অর্ডার হয়নি, আবার চেষ্টা করুন|Order failed, please try again'))}}
const rc=o=>{const m=n=>'৳'+Math.round(N(n)*100)/100,w=window.open('','_blank');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(o.id)}</title><style>body{font:14px sans-serif;max-width:430px;margin:16px auto;padding:0 12px}td,th{padding:5px 0;border-bottom:1px dashed #bbb;text-align:left}td:last-child,th:last-child{text-align:right}table{width:100%;border-collapse:collapse}p{margin:3px 0}.t{font-size:17px;font-weight:700}@media print{button{display:none}}</style></head><body>${cfg.logo?`<img src="${cfg.logo}" style="height:46px"><br>`:''}<h2 style="margin:4px 0">${esc(cfg.name||'')}</h2><p>${esc(cfg.phone||'')}</p><hr><p><b>অর্ডার / Order:</b> ${esc(o.id)}</p><p>${new Date(o.created).toLocaleString('en-GB',{timeZone:'Asia/Dhaka'})}</p><p><b>${esc(o.name)}</b> · ${esc(o.phone)}</p><p>${esc(o.addr)}, ${esc(o.area||'')} ${esc(o.dist||'')}</p><table><tr><th>পণ্য / Item</th><th>পরিমাণ / Qty</th><th>৳</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit||'')}</td><td>${m(i.qty*i.price)}</td></tr>`).join('')}</table><p>সাবটোটাল / Subtotal: ${m(o.sub)}</p><p>ডেলিভারি / Delivery: ${m(o.ship)}</p><p class="t">মোট / Total: ${m(o.total)}</p><p>পেমেন্ট / Payment: ক্যাশ অন ডেলিভারি / Cash on delivery — ${o.payStatus==='paid'?'পরিশোধিত / Paid':'বাকি / Unpaid'}</p><p>অবস্থা / Status: ${esc(o.status)}</p><br><button onclick="print()">🖨 Print / PDF</button></body></html>`);w.document.close()};
function wa(o){const n=WN(cfg.wa||cfg.phone);if(!n)return alert(t('দোকানের WhatsApp নম্বর নেই|Shop WhatsApp number not set'));const m=['নতুন অর্ডার / New order: '+o.id,'নাম / Name: '+o.name,'মোবাইল / Mobile: '+o.phone,'ঠিকানা / Address: '+o.addr+', '+(o.area||'')+' '+(o.dist||''),'পণ্য / Items: '+o.items.map(i=>i.name+' × '+i.qty).join(', '),'মোট / Total: '+mo(o.total)+' (ক্যাশ অন ডেলিভারি / Cash on delivery)'].join('\n');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
function vDone(){const o=DONE;if(!o){V='shop';return vShop()}return`<div class="cd"><h3>✅ ${t('অর্ডার সম্পন্ন!|Order placed!')}</h3><p>${t('আপনার অর্ডার নম্বর|Your order number')}: <b style="font-size:18px">${esc(o.id)}</b></p><p class="m">${t('এটা সংরক্ষণ করুন — অর্ডার ট্র্যাক করতে লাগবে।|Save this — you need it to track your order.')}</p><p>${t('মোট|Total')}: <b>${mo(o.total)}</b> (${t('ক্যাশ অন ডেলিভারি|Cash on delivery')})</p></div><button onclick="rc(DONE)">🧾 ${t('রসিদ|Receipt')}</button> <button class="p" onclick="wa(DONE)">💬 ${t('WhatsApp-এ দোকানকে জানান|Message the shop on WhatsApp')}</button> <button onclick="TR=DONE;V='track';R()">📦 ${t('ট্র্যাক|Track')}</button> <button class="p" onclick="V='shop';R()">${t('আবার কিনুন|Shop again')}</button>`}
async function track(){const id=$('#t_i').value.trim().toUpperCase(),ph=$('#t_p').value.replace(/\D/g,'').slice(-11);if(!id)return;try{const d=await C('orders').doc(id).get(),o=d.data();if(!o||o.phone.replace(/\D/g,'').slice(-11)!==ph){TR=null;alert(t('অর্ডার পাওয়া যায়নি (নম্বর/মোবাইল মিলিয়ে দেখুন)|Order not found (check ID and mobile)'))}else TR=o}catch(e){alert(t('অর্ডার পাওয়া যায়নি|Order not found'))}R()}
function vTrack(){const o=TR,ks=Object.keys(SN),i=o?ks.indexOf(o.status):0;return`<div class="cd"><h3>📦 ${t('অর্ডার ট্র্যাক|Track order')}</h3><input id="t_i" placeholder="${t('অর্ডার নম্বর|Order number')}" value="${esc(o?o.id:localStorage.last||'')}"><input id="t_p" type="tel" placeholder="${t('মোবাইল নম্বর|Mobile number')}"><button class="p" onclick="track()">${t('দেখুন|Check')}</button></div>`+(o?`<div class="cd"><b>${esc(o.id)}</b> · ${t(SN[o.status]||o.status)}<br>${['pending','confirmed','processing','shipped','delivered'].map(k=>`<span class="ch" style="padding:3px 8px;border-radius:8px;${ks.indexOf(k)<=i&&!['cancelled','refunded'].includes(o.status)?'background:var(--br);color:#fff':'border:1px solid var(--bd)'}">${t(SN[k])}</span>`).join('')}<p>${o.items.map(x=>esc(x.name)+' × '+x.qty).join(', ')}</p><p><b>${mo(o.total)}</b> · ${t('ক্যাশ অন ডেলিভারি|Cash on delivery')}</p><button onclick="rc(TR)">🧾 ${t('রসিদ|Receipt')}</button> <button onclick="wa(TR)">💬 WhatsApp</button></div>`:'')+`<button onclick="V='shop';R()">← ${t('দোকান|Shop')}</button>`}
load();
