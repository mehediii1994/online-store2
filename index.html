<script>

 items.forEach(i=>{const p=ps.get(i.productId)||{...P(i.productId)},line=i.qty*i.price,landed=line+(sub?line/sub*adj:0);

async function saveP(f,old){
 const p={...(old||{id:uid('PR'),created:Date.now(),stock:0,avgCost:0,archived:false}),name:f.name.trim(),sku:f.sku.trim(),barcode:f.barcode,category:f.category,unit:(f.customUnit||'').trim()||(f.unit==='__c'?'Piece':f.unit)||'Piece',icon:f.icon||'📦',buy:N(f.buy),retail:N(f.retail),wholesale:N(f.wholesale),min:N(f.min),desc:f.desc};
 if(!p.name||!p.sku||[p.buy,p.retail,p.wholesale,p.min].some(v=>v<0)||D.products.some(x=>x.sku===p.sku&&x.id!==p.id))throw new Error(t('অবৈধ/ডুপ্লিকেট SKU|Invalid data or duplicate SKU'));

const HINT={dash:'আপনার ব্যবসার সারসংক্ষেপ। সব সংখ্যা আসল লেনদেন থেকে আসে।|Your business at a glance. All numbers come from real transactions.',products:'প্রতিটি পণ্য একবার এখানে যোগ করুন। লেনদেন হয়ে গেলে মোছা যায় না, আর্কাইভ হয়।|Add each product once. Items with history are archived, not deleted.',inv:'স্টক দেখুন। স্টক বাড়াতে "➕ স্টক কিনুন" চাপুন।|See your stock. Press "➕ Buy stock" to add more.',pur:'মাল কিনলে এখানে লিখুন। এতে স্টক ও গড় খরচ নিজে থেকে ঠিক হয়।|Record purchases here. Stock and average cost update automatically.',sales:'গ্রাহকের সব পণ্যে একে একে ট্যাপ করুন, পরিমাণ ঠিক করুন; উপরে মোট সদাই দেখা যাবে। শেষে "বিক্রি করুন"।|Tap each product the customer buys, set quantities; the total bill shows on the right. Then press "Sell".',hist:'সব বিক্রয় এখানে। ✏️ সংশোধন, ↩ ফেরত, 🧾 মেমো।|All sales. ✏️ edit, ↩ return, 🧾 memo.',cust:'গ্রাহকের বাকি দেখুন ও ৳ দিয়ে টাকা নিন।|Track customer dues and receive money with ৳.',sup:'সরবরাহকারীর পাওনা দেখুন ও ৳ দিয়ে টাকা দিন।|Track supplier payables and pay with ৳.',exp:'ভাড়া, বিদ্যুৎ ইত্যাদি খরচ লিখুন। নিট লাভে এটি বাদ যায়।|Record rent, power, etc. They reduce net profit.',rep:'তারিখ বেছে রিপোর্ট দেখুন বা CSV নামান।|Pick dates to view reports or download CSV.',set:'নাম, ঠিকানা ও লোগো দিন — মেমোতে ছাপা হবে।|Add your name, address and logo — printed on every memo.',back:'নিয়মিত ব্যাকআপ নিন।|Back up regularly.'};
const GUIDE=[['১. শুরু করুন|1. Getting started',['প্রথমবার ড্যাশবোর্ডে "নমুনা ডেটা" চেপে ডেমো দেখে নিন। শেষে উপরের ♻ Reset দিয়ে মুছে নিজের ডেটা শুরু করুন।|First time: press "Load sample data" on the dashboard to try the demo. Then use ♻ Reset at the top and start with your own data.','উপরে 🌓 দিয়ে Dark মোড, বাংলা/EN দিয়ে ভাষা বদলান।|Use 🌓 for dark mode and বাংলা/EN to switch language.','⚙️ প্রতিষ্ঠান ও লোগো পেজে আপনার নাম, ঠিকানা, ফোন ও লোগো দিন — প্রতিটি মেমোতে ছাপা হবে।|On ⚙️ Business & logo add your name, address, phone and logo — printed on every memo.']],['২. পণ্য যোগ|2. Add products',['📦 পণ্য → "+ নতুন পণ্য"। নাম, SKU (ইউনিক কোড), একক ও দাম লিখুন।|Products → "+ New product". Enter name, SKU (unique code), unit and prices.','আগে থেকে মজুদ থাকলে "প্রারম্ভিক স্টক" লিখুন।|If you already hold stock, fill "Opening stock".']],['৩. মাল কেনা|3. Buy stock',['আগে 🚚 সরবরাহকারী → "+ নতুন" দিয়ে সরবরাহকারী যোগ করুন।|First add a supplier under Suppliers.','🚜 ক্রয় (বা ইনভেন্টরির "➕ স্টক কিনুন") → পণ্য, পরিমাণ, দাম, পরিশোধ লিখে নিশ্চিত করুন। বাকি থাকলে সরবরাহকারীর পাওনা বাড়ে।|Purchase (or "➕ Buy stock" on Inventory) → choose product, quantity, price, amount paid, then confirm. Any unpaid part becomes supplier payable.']],['৪. বিক্রি|4. Sell',['🏪 রোডসাইড শপ → খুচরা বা পাইকারি বেছে পণ্যে ট্যাপ করুন। − / + বা slider দিয়ে পরিমাণ ঠিক করুন।|Roadside shop → pick retail or wholesale, tap a product, set quantity with − / + or the slider.','দাম খরচের নিচে গেলে ⚠ দেখায়। নিচে আনুমানিক লাভ দেখা যায়।|A ⚠ shows if price is below cost. Estimated profit is shown on the right.','গ্রাহক বেছে "প্রাপ্ত টাকা" লিখুন (খালি = পুরো টাকা)। বাকি থাকলে গ্রাহক বাছাই লাগবে। তারপর 🪙 বিক্রি করুন।|Choose a customer and enter "Received" (blank = full). Due needs a customer. Then press 🪙 Sell.']],['৫. মেমো পাঠানো|5. Send a memo',['বিক্রির পর মেমো বক্স আসে: 🖨 প্রিন্ট, ✉️ ইমেইল, 📤 শেয়ার (WhatsApp/মেসেজ)।|After a sale a memo box appears: 🖨 Print, ✉️ Email, 📤 Share (WhatsApp/SMS).','ইমেইল চাপলে আপনার মেইল অ্যাপ খুলবে, শুধু "Send" চাপুন। গ্রাহকের ইমেইল না থাকলে ঠিকানা ফাঁকা রেখেও খুলতে পারেন। পরে বিক্রয় ইতিহাসের 🧾 থেকেও পাবেন।|Email opens your mail app - just press Send. With no customer email you can leave the address blank. Memos are also under 🧾 in Sales history.','একই গ্রাহক একসাথে অনেক পণ্য কিনলে সবগুলো একই মেমোতে যোগ করুন (একই পণ্যে আবার ট্যাপ করলে পরিমাণ ১ বাড়ে)। মেমোতে প্রতিটির দাম ও নিচে "মোট সদাই" ছাপা হয়। আলাদা আলাদা মেমো করে ফেললেও মেমো বক্সে "ওই দিনের সব পণ্য" বেছে একটাই রিসিটে সব পণ্য ও মোট টাকা ছাপাতে পারবেন; চাইলে তারিখ বেছে বা টিক দিয়েও বাছাই করা যায়।|When a customer buys many things, add them all to ONE memo (tapping a product again adds 1 to its quantity). The memo prints each price and a "Grand total". If you sold items as separate memos, choose \"All items that day\" in the memo box to print one receipt with every item and the grand total; you can also pick a date range or untick memos.']],['৬. বাকি আদায় ও পরিশোধ|6. Dues & payments',['🧑‍🌾 গ্রাহক → ৳ চেপে টাকা নিন; 📒 চেপে লেজার দেখুন।|Customers → ৳ to receive money; 📒 for the ledger.','সরবরাহকারীকে টাকা দিতে 🚚 সরবরাহকারী → ৳।|To pay a supplier use Suppliers → ৳.']],['৭. ভুল ঠিক করা|7. Fix mistakes',['পণ্য, গ্রাহক, সরবরাহকারী, খরচ: ✏️ দিয়ে সম্পাদনা।|Products, customers, suppliers, expenses: edit with ✏️.','বিক্রয়: ইতিহাসে ✏️ (পুরনোটা ফেরত হয়ে নতুন করে খোলে) বা ↩ ফেরত।|Sales: ✏️ in history (old sale is reversed and reopened) or ↩ to return.','ভাঙা/হারানো স্টক: ইনভেন্টরিতে ⚖️। আর্থিক লেনদেন মোছা যায় না, এটাই নিয়ম।|Damaged/lost stock: ⚖️ on Inventory. Financial records are never deleted, by design.']],['৮. ব্যাকআপ|8. Backup',['💾 ব্যাকআপ → ফাইল নামান বা ☁️ Google Drive-এ রাখুন। ফোন বা ব্রাউজার বদলালে ফাইল আপলোড করে রিস্টোর করুন।|Backup → download the file or save to Google Drive. On a new phone/browser upload the file to restore.','সপ্তাহে অন্তত একবার ব্যাকআপ নিন। ব্রাউজারের ডেটা মুছলে ব্যাকআপ ছাড়া ফেরত পাওয়া যায় না।|Back up at least weekly. Clearing browser data without a backup loses everything.']],['১০. একক ও দাম|10. Units & prices',['প্রতিটি পণ্যের একক বেছে নিন: পিস, প্রতিটি, কেজি, গ্রাম, লিটার, মিলিলিটার, বাক্স, প্যাকেট, ডজন, বস্তা — বা "নিজের একক" লিখুন।|Pick a unit per product: piece, each, kg, gram, liter, ml, box, packet, dozen, sack — or type a custom unit.','সব জায়গায় দাম এভাবে দেখায়: "৳৬৫ প্রতি কেজি", "৳১২০ প্রতি ডজন", "৳৫০ প্রতিটি"।|Prices are shown everywhere as "৳65 per kg", "৳120 per dozen", "৳50 each".']],['১১. সম্পাদনা, মোছা, রিসেট|11. Edit, delete, reset',['✏️ সম্পাদনা, 🗑 মোছা ও ↺ রিসেট প্রায় সব জায়গায় আছে। ফর্মের ভেতরে ↺ রিসেট বাটন ঘরগুলো আগের অবস্থায় ফেরায়। উপরের ♻ Reset সব ডেটা মোছে।|✏️ Edit, 🗑 delete and ↺ reset are available almost everywhere. ↺ inside a form restores its fields; ♻ at the top erases all data.','লেনদেন আছে এমন পণ্য, গ্রাহক বা সরবরাহকারী আর্কাইভ হয় (↩ দিয়ে ফেরান)। বিক্রয়, ক্রয় ও খরচ মুছলে হিসাব থেকে বাদ যায়, কিন্তু ইতিহাসে চিহ্নসহ থাকে।|Products, customers or suppliers with history are archived (restore with ↩). Deleted sales, purchases and expenses leave the totals but stay in history, marked.']],['১২. GitHub-এ রাখা|12. Put it on GitHub',['এখন পুরো অ্যাপ একটাই index.html ফাইল। GitHub → New repository → ফাইলটি Upload → Settings → Pages → Branch main → Save।|The whole app is now a single index.html. GitHub → New repository → upload the file → Settings → Pages → Branch main → Save.','Windows 10-এ ফাইলটি ডাবল-ক্লিক করলেই Chrome/Edge-এ খুলবে।|On Windows 10 just double-click the file to open it in Chrome/Edge.']],['১৩. টেস্ট চেকলিস্ট|13. Test checklist',['পণ্য যোগ → স্টক ও গড় খরচ ঠিক? কেনার পর গড় খরচ weighted average মেলে?|Add product → stock and average cost right? After a purchase the weighted average matches?','slider ও টাইপ করা পরিমাণে একই মোট? স্টকের বেশি/ঋণাত্মক পরিমাণ আটকায়?|Slider and typed quantity give the same total? Over-stock/negative quantity is blocked?','আংশিক টাকা → বাকি ঠিক? বিক্রয় মুছলে স্টক ও বাকি ফেরে?|Partial payment → due correct? Deleting a sale restores stock and due?','নিট লাভ = বিক্রয় − COGS − খরচ − ক্ষতি। ব্যাকআপ → মুছে ফেলা → রিস্টোর করলে সব ফেরে?|Net profit = sales − COGS − expenses − losses. Backup → erase → restore brings everything back?']],['৯. মোবাইলে অ্যাপের মতো ইনস্টল|9. Install on your phone',['GitHub Pages-এর লিংক ফোনের Chrome-এ খুলুন → মেনু (⋮) → "Add to Home screen / Install app"। iPhone-এ Safari → Share → "Add to Home Screen"।|Open your GitHub Pages link in Chrome → menu (⋮) → "Add to Home screen / Install app". On iPhone: Safari → Share → "Add to Home Screen".','index.html ফাইলটি ফোনে সংরক্ষণ করে রাখলে ইন্টারনেট ছাড়াও খোলা যায় (চার্ট তখন সাধারণ বারে দেখাবে)। নিচের বারটি স্ক্রল করে সব মেনু পাবেন।|Keep a saved copy of index.html on your phone to open it offline (charts then show as simple bars). Scroll the bottom bar to reach every menu.']]];
const vGuide=()=>GUIDE.map(g=>`<div class="card crate" style="margin-bottom:12px"><h3>${t(g[0])}</h3><ul>${g[1].map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`).join('');
const NAV=[['dash','ড্যাশবোর্ড|Dashboard',vDash],['guide','সাহায্য ও গাইড|Help & guide',vGuide],['products','পণ্য|Products',vProducts],['inv','ইনভেন্টরি|Inventory',vInv],['pur','ক্রয়|Purchase',vPur],['sales','রোডসাইড শপ (বিক্রয়)|Roadside shop',vSales],['hist','বিক্রয় ইতিহাস|Sales history',vHist],['cust','গ্রাহক|Customers',()=>vParty('customers')],['sup','সরবরাহকারী|Suppliers',()=>vParty('suppliers')],['exp','খরচ|Expenses',vExp],['rep','রিপোর্ট|Reports',vRep],['orders','অনলাইন অর্ডার|Online orders',vOrders],['shopset','অনলাইন দোকান|Online shop',vShopSet],['set','প্রতিষ্ঠান ও লোগো|Business & logo',vSet],['back','ব্যাকআপ|Backup',vBack]];
const go=v=>{V=v;Q='';render();scrollTo(0,0)},setL=()=>{L=L==='bn'?'en':'bn';localStorage.lang=L;render()},setTh=()=>{document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?1:''};
function render(){const n=NAV.find(x=>x[0]===V);charts.forEach(c=>c.destroy());cq=[];document.documentElement.lang=L;
 $('#nav').innerHTML=`<h2>${biz().logo?`<img src="${biz().logo}">`:''}${esc(biz().name||'SmartBiz')}</h2>`+NAV.filter(x=>SYNC.can(x[0])).map(x=>`<button class="${x[0]===V?'on':''}" onclick="go('${x[0]}')"><span class="ni">${NI[x[0]]}</span><small>${t(x[1])}</small></button>`).join('');$('#ttl').textContent=t(n[1]);$('#brand').innerHTML=(biz().logo?`<img src="${biz().logo}">`:'')+esc(biz().name||'');{const a=D.sales.filter(x=>!x.returned);$('#coins').textContent='🪙 '+money(sum(a,x=>x.net)-sum(a,x=>x.cogs)-sum(EX(),e=>e.amount)-sum(D.moves,m=>m.loss))}$('#view').innerHTML=(HINT[V]?`<p class="k">💡 ${t(HINT[V])}</p>`:'')+n[2]();
 if(V==='products')pList();if(V==='pur')plines();if(V==='sales'){slines();spick('')}if(V==='hist')hList();
 document.querySelector('aside .on')?.scrollIntoView?.({inline:'center',block:'nearest'});charts=typeof Chart==='undefined'?[]:cq.map(([id,cfg])=>new Chart($('#'+id),{...cfg,options:{responsive:true,plugins:{legend:{display:cfg.data.datasets.length>1}}}}))}

const FB={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}; // <-- নতুন Firebase config এখানে বসান (index.html ও shop.html দুটোতেই একই)
const SYNC=(()=>{let fs,au,role=null,tmr;const SHOP='main',on=()=>!!FB.apiKey&&typeof firebase!=='undefined',
col=s=>fs.collection('shops').doc(SHOP).collection(s),cl=o=>JSON.parse(JSON.stringify(o)),ud=id=>col('users').doc(id),
pubSync=o=>{const d=col('pub').doc(o.id);if(o.pub&&!o.archived)d.set(cl({id:o.id,name:o.name,cat:o.category||'',unit:o.unit||'',icon:o.icon||'',price:N(o.retail),stock:N(o.stock),desc:o.od||'',img:o.img||'',t:Date.now()})).catch(console.warn);else if(role==='owner')d.delete().catch(console.warn)},
push=w=>{if(!on()||!role)return;for(const[s,a]of Object.entries(w))for(const o of a){col(s).doc(o.id).set(cl(o)).catch(console.warn);if(s==='products')pubSync(o)}},
del=(s,id)=>{if(on()&&role){col(s).doc(id).delete().catch(console.warn);if(s==='products'&&role==='owner')col('pub').doc(id).delete().catch(console.warn)}},
all=async d=>{if(!on()||role!=='owner')return;for(const s of ST){const keep=new Set((d[s]||[]).map(r=>r.id));(await col(s).get()).forEach(x=>{if(!keep.has(x.id))x.ref.delete()});(d[s]||[]).forEach(r=>col(s).doc(r.id).set(cl(r)))}},
listen=()=>ST.forEach(s=>col(s).onSnapshot(sn=>{const ch=sn.docChanges().filter(c=>!c.doc.metadata.hasPendingWrites);if(!ch.length)return;const x=db.transaction(s,'readwrite'),o=x.objectStore(s);ch.forEach(c=>c.type==='removed'?o.delete(c.doc.id):o.put(c.doc.data()));x.oncomplete=()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{await load();if(!['sales','pur'].includes(V))render()},400)}})),
